{% extends 'base.html' %}
{% block title %}Betrag prüfen - Gourmen{% endblock %}
{% block content %}
<div class="container"><div class="page-header"><h1>Betrag prüfen</h1></div><div class="page-content">
<p class="page-back"><a href="{{ url_for('events.detail', event_id=event.id, tab='billbro') }}">Zurück zu BillBro</a></p>
{% if field %}<form method="POST" action="{{ request.path }}" class="form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% if field == 'guess_amount' %}<input type="hidden" name="esstyp" value="{{ esstyp }}">{% endif %}
<div class="form-field"><label class="form-field__label" for="corrected-amount">{{ labels[field] }}</label>
<input class="form-field__input" id="corrected-amount" name="{{ field }}" value="{{ value }}" type="text" inputmode="decimal" required aria-invalid="true" aria-describedby="amount-error">
<p id="amount-error" class="form-field__error" role="alert">{{ error }}</p></div>
<button type="submit" class="btn btn--primary">Korrigierten Betrag speichern</button>
</form>{% else %}<p class="form-field__error" role="alert">{{ error }}</p>{% endif %}
</div></div>
{% endblock %}
