ze:14px}#gourmen-account .ka-status{color:var(--gf-accent);font-size:14px}#gourmen-account .ka-pass{display:flex;gap:8px;align-items:center}#gourmen-account .ka-pass input{flex:1}#gourmen-account .ka-code{text-align:center;letter-spacing:6px;font-variant-numeric:tabular-nums}#gourmen-account .ka-qr{display:grid;place-items:center;gap:12px;background:var(--gf-inset);padding:24px;margin:18px 0;border-radius:8px}#gourmen-account .ka-qr svg{width:72px;height:72px}#gourmen-account .ka-codes{font-family:monospace;line-height:2;overflow-wrap:anywhere}#gourmen-account dialog{background:var(--gf-surface);color:var(--gf-fg);border:1px solid var(--gf-line);border-radius:12px;padding:24px;max-width:480px;width:calc(100% - 40px)}#gourmen-account dialog::backdrop{background:#0008}#gourmen-account .ka-preview{display:flex;gap:10px;align-items:center;font-size:13px}#gourmen-account .ka-preview select{font-size:13px;width:auto;max-width:240px}#gourmen-account .gf-app[data-auth="true"] .gf-sidebar,#gourmen-account .gf-app[data-auth="true"] .gf-bottomnav,#gourmen-account .gf-app[data-auth="true"] .gf-account{display:none}#gourmen-account .gf-app[data-auth="true"] .gf-layout{display:block}#gourmen-account .gf-app[data-auth="true"] .gf-main{max-width:650px;margin:auto;width:100%}#gourmen-account .gf-app[data-view="mobile"] .ka-grid{grid-template-columns:1fr}#gourmen-account .gf-app[data-view="mobile"] .ka-panel{padding:18px}

<script>
(()=>{const root=document.getElementById('gourmen-account'),q=s=>root.querySelector(s),state={view:'mobile',theme:'auto',example:'account',page:'account',fail:false};let notice='',pending=null,afterVerify='password',mfaEnabled=true,remembered=true,backup=false,push=false,verified=false;const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`,examples={account:'Konto & Einstellungen',login:'Anmeldung',forgot:'Passwort vergessen',activate:'Einladung annehmen',expired:'Link abgelaufen',blocked:'Zugang nicht möglich'},authPages=['login','mfa','forgot','sent','reset','activate','expired','blocked','help','login-done'];
function restore(v){if(v?.design!=='account-access-v1')return;if(['mobile','tablet','desktop'].includes(v.view))state.view=v.view;if(['auto','light','dark'].includes(v.theme))state.theme=v.theme;if(examples[v.example]){state.example=v.example;state.page=v.example}}function save(){window.openai?.setWidgetState?.({modelContent:{design:'account-access-v1',view:state.view,theme:state.theme,example:state.example},privateContent:null})?.catch(()=>{})}function icons(){root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));globalThis.lucide?.createIcons({attrs:{width:20,height:20}})}function chrome(){q('.gf-app').dataset.view=state.view;q('.gf-app').dataset.auth=String(authPages.includes(state.page));root.style.colorScheme=state.theme==='auto'?'light dark':state.theme;root.querySelectorAll('button[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));q('[data-theme-toggle]').setAttribute('aria-checked',String(state.theme==='dark'||state.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches));q('#ka-example').value=state.example;icons()}
const row=(title,sub,action)=>`<div class="ka-row"><div><strong>${title}</strong><p class="ka-muted">${sub}</p></div>${action}</div>`,button=(id,text)=>`<button id="${id}">${text}</button>`,back=(target,label)=>`<button class="ka-link" data-page="${target}">${icon('arrow-left')}${label}</button>`,err='<p id="ka-error" class="ka-error" role="alert" hidden></p>',pw=(id,label,auto='off')=>`<label>${label}<span class="ka-pass"><input id="${id}" type="password" autocomplete="${auto}" placeholder="Nur ein Beispiel eingeben"><button type="button" data-show="${id}" aria-label="${label} anzeigen" aria-pressed="false">${icon('eye')}</button></span></label>`,form=(type,content,submit)=>`<form data-form="${type}" novalidate>${content}${err}<div class="ka-actions"><button class="gf-primary" type="submit">${submit}</button></div></form>`;
function render(){let html='';const n=notice?'<div class="ka-note" role="status">'+notice+'</div>':'';
if(state.page==='account')html=`<h1>Konto & Einstellungen</h1>${n}<div class="ka-grid"><section class="ka-panel"><h2>Mein Konto</h2>${row('Alex Beispiel','Mitglied · alex@example.invalid',button('ka-profile',icon('pencil')+'Profil bearbeiten'))}${row('Geschützte Angaben','Erneute Bestätigung erforderlich',button('ka-sensitive','Ansehen'))}</section><section class="ka-panel"><h2>Sicherheit</h2>${row('Passwort','Eigenes Passwort verwalten',button('ka-password','Ändern'))}${row('Zwei-Faktor-Anmeldung',mfaEnabled?'Aktiv · Authenticator-App':'Noch nicht eingerichtet',button('ka-security','Verwalten'))}${row('Gemerkte Geräte',remembered?'1 Gerät · Beispielbestand':'Keine gemerkten Geräte',button('ka-devices','Ansehen'))}</section><section class="ka-panel"><h2>Darstellung</h2><label>Farbschema<select id="ka-theme"><option value="auto">Wie auf dem Gerät</option><option value="light">Hell</option><option value="dark">Dunkel</option></select></label><p class="ka-muted">Der Schalter in der Kopfzeile wechselt ebenfalls das Farbschema.</p></section><section class="ka-panel"><h2>Benachrichtigungen</h2><p>${push?'Auf diesem Gerät aktiviert':'Auf diesem Gerät nicht aktiviert'}</p><button id="ka-push">${push?'Deaktivieren':'Auf diesem Gerät aktivieren'}</button><p class="ka-muted">Die Berechtigung gilt je Gerät und Browser.</p></section></div><div class="ka-actions"><button id="ka-logout">${icon('log-out')}Abmelden</button></div>`;
if(state.page==='security')html=`${back('account','Zum Konto')}<h1>Zwei-Faktor-Anmeldung</h1>${n}<section class="ka-panel ka-compact"><h2>${mfaEnabled?'Zusätzlicher Schutz aktiv':'Zusätzlichen Schutz einrichten'}</h2><p class="ka-muted">Nach dem Passwort bestätigst du die Anmeldung mit einem Code aus deiner Authenticator-App.</p><div class="ka-actions">${mfaEnabled?button('ka-backup-new','Neue Wiederherstellungscodes')+'<button id="ka-disable" class="ka-link">Zwei-Faktor-Anmeldung deaktivieren</button>':button('ka-enroll','Einrichten')}</div><p class="ka-muted">Wiederherstellungscodes getrennt vom Gerät aufbewahren.</p></section>`;
if(state.page==='devices')html=`${back('account','Zum Konto')}<h1>Gemerkte Geräte</h1>${n}<section class="ka-panel ka-compact">${remembered?row('iPhone · Safari','Beispielgerät · bei Anmeldung gemerkt',button('ka-revoke','Nicht mehr vertrauen')):'<p>Keine gemerkten Geräte.</p>'}<p class="ka-muted">Gerätevertrauen und laufende Anmeldungen sind unterschiedliche Dinge. Der Widerruf bestehender Anmeldungen ist separat festzulegen.</p></section>`;
if(state.page==='verify')html=`${back('account','Abbrechen und zum Konto')}<div class="ka-form"><h1>Identität bestätigen</h1><section class="ka-panel"><p>Für ${afterVerify==='password'?'die Passwortänderung':afterVerify==='sensitive'?'geschützte Angaben':'die Änderung deiner Sicherheitseinstellungen'} bestätige bitte noch einmal dein Passwort.</p>${form('verify',pw('ka-current','Aktuelles Passwort','current-password'),'Bestätigen')}<p class="ka-muted">Danach geht es direkt mit deiner gewählten Aktion weiter.</p></section></div>`;
if(state.page==='password'||state.page==='reset'||state.page==='activate'){const activation=state.page==='activate';html=`${back(state.page==='password'?'account':'login',state.page==='password'?'Zum Konto':'Zur Anmeldung')}<div class="ka-form"><h1>${activation?'Willkommen bei Gourmen':state.page==='password'?'Passwort ändern':'Neues Passwort setzen'}</h1><section class="ka-panel">${activation?'<p>Richte dein persönliches Passwort ein.</p>':''}${form('password',pw('ka-new','Neues Passwort','new-password')+pw('ka-repeat','Passwort wiederholen','new-password')+'<p class="ka-muted">Passwortregeln werden direkt bei der Eingabe angezeigt. In dieser Vorschau wird kein Passwort gespeichert.</p>',activation?'Passwort festlegen':'Passwort speichern')}</section></div>`}
if(state.page==='login')html=`<div class="ka-form"><h1>Willkommen zurück</h1><section class="ka-panel"><p class="ka-muted">Melde dich für den Mitgliederbereich an.</p>${n}${form('login','<label>E-Mail<input id="ka-email" type="email" autocomplete="username" placeholder="alex@example.invalid"></label>'+pw('ka-loginpw','Passwort','current-password'),'Anmelden')}<div class="ka-actions"><button class="ka-link" data-page="forgot">Passwort vergessen?</button></div></section><p class="ka-muted">Beispielziel nach Anmeldung: Monatsessen Oktober</p></div>`;
if(state.page==='mfa')html=`<div class="ka-form">${back('login','Zur Anmeldung')}<h1>${backup?'Wiederherstellungscode':'Anmeldung bestätigen'}</h1><section class="ka-panel"><p>${backup?'Verwende einen deiner gesicherten Einmalcodes.':'Gib den sechsstelligen Code deiner Authenticator-App ein.'}</p>${form('mfa',`<label>${backup?'Wiederherstellungscode':'Bestätigungscode'}<input id="ka-code" ${backup?'':'class="ka-code" inputmode="numeric" maxlength="6"'} autocomplete="one-time-code" placeholder="${backup?'BEISPIEL-CODE':'123456'}"></label>`,'Bestätigen')}<div class="ka-actions"><button id="ka-backup" class="ka-link">${backup?'Authenticator-Code verwenden':'Wiederherstellungscode verwenden'}</button><button class="ka-link" data-page="help">Keinen Zugriff mehr?</button></div></section></div>`;
if(state.page==='forgot')html=`<div class="ka-form">${back('login','Zur Anmeldung')}<h1>Passwort vergessen?</h1><section class="ka-panel"><p>Fordere einen Link zum Setzen eines neuen Passworts an.</p>${form('forgot','<label>E-Mail<input id="ka-email" type="email" autocomplete="username" placeholder="alex@example.invalid"></label>','Link anfordern')}</section></div>`;
if(state.page==='sent')html=`<div class="ka-form"><h1>Prüfe dein Postfach</h1><section class="ka-panel"><p>Falls zu dieser Adresse ein aktiver Zugang besteht, erhältst du weitere Schritte per E-Mail.</p><p class="ka-muted">Auch im Spamordner nachsehen. Es wurde keine echte E-Mail versendet.</p><div class="ka-actions"><button data-page="login">Zur Anmeldung</button><button class="ka-link" data-page="forgot">Adresse korrigieren</button></div></section><button id="ka-example-link" class="ka-link">Beispiellink öffnen</button></div>`;
if(state.page==='expired')html=`<div class="ka-form"><h1>Link nicht mehr gültig</h1><section class="ka-panel"><p>Dieser Link ist abgelaufen oder bereits verwendet worden.</p><div class="ka-actions"><button class="gf-primary" data-page="forgot">Neuen Link anfordern</button><button data-page="login">Zur Anmeldung</button></div></section></div>`;
if(state.page==='blocked'||state.page==='help')html=`<div class="ka-form"><h1>${state.page==='help'?'Zugang wiederherstellen':'Zugang nicht möglich'}</h1><section class="ka-panel"><p>${state.page==='help'?'Wenn Authenticator und Wiederherstellungscodes fehlen, benötigst du Hilfe bei der Wiederherstellung.':'Dein Zugang kann im Moment nicht verwendet werden.'}</p><p>Wende dich an die für die Mitgliederverwaltung zuständige Person im Verein.</p><p class="ka-muted">Die Wiederherstellung benötigt eine Identitätsprüfung. Hier wird kein Sicherheitsfaktor zurückgesetzt.</p><div class="ka-actions"><button data-page="login">Zur Anmeldung</button></div></section></div>`;
if(state.page==='login-done')html=`<div class="ka-form"><h1>Anmeldung bestätigt</h1><section class="ka-panel"><p>Du kehrst zum ursprünglich gewünschten Inhalt zurück.</p><h2>Monatsessen Oktober</h2><p class="ka-muted">Zielseite der Beispielanmeldung. Kein echter Login ausgeführt.</p><button id="ka-home" class="gf-primary">Kontoübersicht ansehen</button></section></div>`;
if(state.page==='sensitive')html=`${back('account','Zum Konto')}<h1>Geschützte Angaben</h1><section class="ka-panel ka-compact"><p class="ka-status">Identität für diese Ansicht bestätigt · Vorschau</p><p>Hier stehen deine geschützten Mitgliederdaten.</p><p class="ka-muted">Keine echten Personendaten im Entwurf. Feldgestaltung folgt dem bestätigten Profilformular.</p><button data-page="account">Ansicht schliessen</button></section>`;
if(state.page==='enroll')html=`${back('security','Einrichtung abbrechen')}<div class="ka-form"><h1>Authenticator einrichten</h1><section class="ka-panel"><p>1. Code mit deiner Authenticator-App scannen.</p><div class="ka-qr">${icon('qr-code')}<span class="ka-muted">Platzhalter · kein echter Einrichtungscode</span></div><p>2. Einrichtung mit dem angezeigten Zahlencode bestätigen.</p>${form('enroll','<label>Bestätigungscode<input id="ka-code" class="ka-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></label>','Einrichtung bestätigen')}</section></div>`;
if(state.page==='codes')html=`${back('security','Zur Sicherheit')}<div class="ka-form"><h1>Codes sicher aufbewahren</h1><section class="ka-panel"><p>Wiederherstellungscodes helfen, wenn dein Authenticator nicht verfügbar ist.</p><div class="ka-note ka-codes">BEISPIEL-CODE-01<br>BEISPIEL-CODE-02<br>BEISPIEL-CODE-03</div><p class="ka-muted">Nur Darstellungsbeispiele. Keine gültigen Codes.</p><label class="ka-check"><input type="checkbox" id="ka-kept">Ich habe die Codes gesichert.</label><button id="ka-finish" class="gf-primary" disabled>Einrichtung abschliessen</button></section></div>`;
q('#ka-content').innerHTML=html;chrome();if(q('#ka-theme'))q('#ka-theme').value=state.theme}
function go(page){verified=false;state.page=page;notice='';render();q('#ka-content').scrollIntoView({block:'start'});const first=q('#ka-content input')||q('#ka-content button');first?.focus({preventScroll:true})}function failure(msg,id){q('#ka-error').hidden=false;q('#ka-error').textContent=msg;if(id)q(id)?.focus()}function dialog(title,text,fn){pending=fn;q('#ka-dialog-title').textContent=title;q('#ka-dialog-copy').textContent=text;q('#ka-dialog').showModal()}function verifyFor(target){afterVerify=target;go('verify')}
root.addEventListener('change',e=>{if(e.target.id==='ka-example'){state.example=e.target.value;backup=false;go(state.example);save()}if(e.target.id==='ka-theme'){state.theme=e.target.value;chrome();save()}if(e.target.id==='ka-kept')q('#ka-finish').disabled=!e.target.checked});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;chrome();save();return}if(b.hasAttribute('data-theme-toggle')){state.theme=b.getAttribute('aria-checked')==='true'?'light':'dark';chrome();if(q('#ka-theme'))q('#ka-theme').value=state.theme;save();return}if(b.dataset.show){const input=q('#'+b.dataset.show),show=input.type==='password';input.type=show?'text':'password';b.setAttribute('aria-pressed',String(show));b.setAttribute('aria-label',show?'Passwort verbergen':'Passwort anzeigen');return}if(b.dataset.page){go(b.dataset.page);return}if(b.id==='ka-cancel'){q('#ka-dialog').close();return}if(b.id==='ka-confirm'){q('#ka-dialog').close();pending?.();return}if(b.id==='ka-password'){verifyFor('password');return}if(b.id==='ka-sensitive'){verifyFor('sensitive');return}if(b.id==='ka-security'){go('security');return}if(b.id==='ka-devices'){go('devices');return}if(b.id==='ka-backup'){backup=!backup;go('mfa');return}if(b.id==='ka-enroll'){verifyFor('enroll');return}if(b.id==='ka-backup-new'){verifyFor('codes');return}if(b.id==='ka-disable'){verifyFor('disable');return}if(b.id==='ka-revoke'){dialog('Diesem Gerät nicht mehr vertrauen?','Bei einer künftigen Anmeldung wird wieder ein zweiter Faktor benötigt. Bestehende Sitzungen werden durch diesen Entwurf nicht als beendet dargestellt.',()=>{remembered=false;notice='Gerätevertrauen entfernt · Vorschau';render()});return}if(b.id==='ka-push'){push=!push;notice='Geräteberechtigung nur simuliert. Keine Browseranfrage ausgelöst.';render();return}if(b.id==='ka-logout'){dialog('Abmelden?','Du verlässt die aktuelle Beispielanmeldung.',()=>{state.example='login';go('login');save()});return}if(b.id==='ka-home'){state.example='account';go('account');save();return}if(b.id==='ka-example-link'){go('reset');return}if(b.id==='ka-finish'){mfaEnabled=true;go('security');notice='Einrichtung abgeschlossen · Vorschau';render();return}if(b.id==='ka-profile'){notice='Profilbearbeitung verwendet das bereits bestätigte Formularmuster.';render();return}if(b.classList.contains('gf-account')){q('.gf-account-panel').hidden=!q('.gf-account-panel').hidden;b.setAttribute('aria-expanded',!q('.gf-account-panel').hidden);return}if(b.dataset.go){if(b.dataset.go==='security')go('security');else if(['settings','profile'].includes(b.dataset.go)){state.example='account';go('account')}else{notice='Dieser Bereich gehört zu einem eigenen Entwurf.';render()}q('.gf-account-panel').hidden=true}});
root.addEventListener('submit',e=>{const type=e.target.dataset.form;if(!type)return;e.preventDefault();if(state.fail){failure(type==='login'?'Anmeldung nicht möglich. Prüfe deine Angaben und versuche es erneut.':'Bestätigung nicht erfolgreich. Bitte erneut versuchen.');return}if(type==='login'||type==='forgot'){if(!q('#ka-email').value.trim()||!q('#ka-email').validity.valid){failure('Bitte eine gültige E-Mail-Adresse eingeben.','#ka-email');return}if(type==='login'&&!q('#ka-loginpw').value){failure('Bitte ein Beispielpasswort eingeben.','#ka-loginpw');return}go(type==='login'?'mfa':'sent');return}if(type==='mfa'||type==='enroll'){const c=q('#ka-code').value.trim();if(type==='mfa'&&backup?c!=='BEISPIEL-CODE':c!=='123456'){failure('Code nicht bestätigt. Im Beispiel: '+(type==='mfa'&&backup?'BEISPIEL-CODE':'123456')+'.','#ka-code');return}go(type==='enroll'?'codes':'login-done');return}if(type==='verify'){if(!q('#ka-current').value){failure('Bitte dein Beispielpasswort eingeben.','#ka-current');return}verified=true;if(afterVerify==='disable'){dialog('Zwei-Faktor-Anmeldung deaktivieren?','Danach entfällt die zusätzliche Bestätigung bei der Anmeldung. Dies ist nur eine Darstellung; die erforderliche Freigabe ist fachlich festzulegen.',()=>{mfaEnabled=false;go('security')});return}if(afterVerify==='codes'){dialog('Neue Wiederherstellungscodes?','Die bisherigen Codes sollen durch neue ersetzt werden. Alte Codes wären danach ungültig. Keine echten Codes betroffen.',()=>go('codes'));return}go(afterVerify);return}if(type==='password'){if(!q('#ka-new').value){failure('Bitte ein Beispielpasswort eingeben.','#ka-new');return}if(q('#ka-new').value!==q('#ka-repeat').value){failure('Die Passwörter stimmen nicht überein.','#ka-repeat');return}const selfChange=state.page==='password';state.example=selfChange?'account':'login';go(selfChange?'account':'login');notice=selfChange?'Passwort geändert · Vorschau. Du bleibst hier angemeldet. Andere Sitzungen und deren Gerätevertrauen sind beendet; dort ist eine neue Anmeldung inklusive Zwei-Faktor-Bestätigung nötig.':'Neues Passwort gesetzt · Vorschau. Bitte neu anmelden; eine vorhandene Zwei-Faktor-Anmeldung bleibt aktiv.';render();save()}});
window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.modelContent;if(v?.design!== 'account-access-v1')return;const page=state.page;restore(v);state.page=page;chrome()});restore(window.openai?.widgetState?.modelContent);render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{}});t.addToggle(state,'fail',{label:'Fehlgeschlagene Bestätigung simulieren'})}
})();
</script>
