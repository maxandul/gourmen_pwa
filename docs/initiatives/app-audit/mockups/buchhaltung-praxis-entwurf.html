#gourmen-accounting-practice .ap-values{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px;font-variant-numeric:tabular-nums}
#gourmen-accounting-practice .ap-values dt{font-size:12px;color:var(--gf-muted);margin-bottom:5px}
#gourmen-accounting-practice .ap-values dd{margin:0;font-size:16px}
#gourmen-accounting-practice .ap-values input{max-width:150px}
#gourmen-accounting-practice .ap-radio{display:flex;align-items:center;gap:12px;min-height:44px}
#gourmen-accounting-practice .ap-radio input{width:20px;min-height:20px;margin:0}
#gourmen-accounting-practice .ap-return{display:none;margin-bottom:16px}
#gourmen-accounting-practice .ap-error{color:var(--gf-warning);background:var(--gf-warning-bg);padding:12px;border-radius:6px}
#gourmen-accounting-practice .ac-row{flex-wrap:wrap}
#gourmen-accounting-practice button,#gourmen-accounting-practice input,#gourmen-accounting-practice select{-webkit-tap-highlight-color:transparent}
@container(max-width:800px){#gourmen-accounting-practice .ap-values{grid-template-columns:repeat(2,minmax(0,1fr))}#gourmen-accounting-practice .ap-return{display:inline-flex}#gourmen-accounting-practice .ap-detail-open .ap-bank-list{display:none}}
@container(max-width:520px){#gourmen-accounting-practice .ap-summary{grid-template-columns:1fr}#gourmen-accounting-practice .ap-summary>div{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}#gourmen-accounting-practice .ap-summary strong{font-size:20px;margin:0}#gourmen-accounting-practice .ap-summary span:last-child{flex-basis:100%}#gourmen-accounting-practice .ap-item{padding:12px}}
</style>
<script>
(()=>{
const root=document.getElementById('gourmen-accounting-practice'),app=root.querySelector('.gf-app'),content=root.querySelector('#ap-content'),theme=root.querySelector('[data-theme-toggle]'),account=root.querySelector('.gf-account'),menu=root.querySelector('.gf-account-panel');
const state={view:'mobile',theme:'auto',area:'bank',selected:null,budgetMode:'proposal'};
const restore=s=>{if(s?.design!=='accounting-practice-v4')return;for(const [k,values] of Object.entries({view:['mobile','tablet','desktop'],theme:['auto','light','dark'],area:['bank','open','fees','budget','year'],budgetMode:['proposal','decision']}))if(values.includes(s[k]))state[k]=s[k];};restore(window.openai?.widgetState?.modelContent);
const system=matchMedia('(prefers-color-scheme: dark)');
const done=new Set();let imported=false,feesCreated=false,budgetSaved=false;
let savedFee=120,savedDue='2027-03-31',savedBudget=[1320,2200,600],savedDate='2027-02-12';
const exceptions={},versions=[];let historyPick=-1,budgetReason='GV-Beschluss',budgetDraft=null;const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const members=['Alex','Luca','Nina','Mia','Noah','Lea','Jonas','Sara','Ben','Emma','Leon'];
const transactions=[{id:'split',name:'Alex Beispiel',date:'06.10.2026',amount:'+ 204.00',kind:'Sammelzahlung',note:'Beitrag und Essensanteil'}, {id:'trip',name:'Hotel Seeblick',date:'05.10.2026',amount:'− 800.00',kind:'Rechnung bereits erfasst',note:'Jahresausflug · 4500'}, {id:'card',name:'Restaurant Linde',date:'04.10.2026',amount:'− 240.00',kind:'Kartenzahlung',note:'Jahresausflug · noch zuordnen'}];
const money=n=>new Intl.NumberFormat('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const btn=(label,action,primary=false,disabled=false)=>`<button type="button" data-action="${action}" ${primary?'class="gf-primary"':''} ${disabled?'disabled':''}>${label}</button>`;
const row=(label,value)=>`<div class="ac-row"><span>${label}</span><strong>${value}</strong></div>`;
function save(){window.openai?.setWidgetState?.({modelContent:{design:'accounting-practice-v4',view:state.view,theme:state.theme,area:state.area,budgetMode:state.budgetMode},privateContent:null})?.catch(()=>{});}
function feedback(t){const f=root.querySelector('.gf-feedback');f.textContent=t;f.hidden=false;}
function closeMenu(){menu.hidden=true;account.setAttribute('aria-expanded','false');}
function bank(){return `<div class="ac-section-title"><h2>Vereinskonto</h2>${btn('Kontoauszug importieren','import',true)}</div><div class="ap-summary"><div><span>Kontostand</span><strong>CHF 8’450.00</strong><span>Auszug bis 06.10.2026</span></div><div><span>Noch zuzuordnen</span><strong>${3-done.size} ${done.size===2?"Bewegung":"Bewegungen"}</strong><span>Eingänge und Ausgänge</span></div><div><span>Letzter Import</span><strong>Oktober 2026</strong><span>3 Bewegungen · Beispieldatei</span></div></div>${imported?'<p class="ap-status" role="status">Beispieldatei bereits importiert: 3 bekannte Bewegungen, keine neue Buchung.</p>':''}<div class="ac-columns ${state.selected?'ap-detail-open':''}"><section class="ap-bank-list"><h2>Kontobewegungen</h2>${transactions.map(t=>`<button class="ap-item" data-transaction="${t.id}" aria-pressed="${state.selected===t.id}"><span>${t.name}<small>${t.date} · ${t.kind}</small><small>${done.has(t.id)?'Zugeordnet':t.note}</small></span><b>CHF ${t.amount}</b></button>`).join('')}<p class="ac-note">Der Kontostand enthält auch noch nicht zugeordnete Bewegungen.</p></section><section>${state.selected?detail():`<div class="ac-card"><h2>Zuordnung prüfen</h2><p class="ac-muted">Wähle eine Kontobewegung. Bereits erfasste Rechnungen und offene Forderungen erscheinen beim Zuordnen.</p></div>`}</section></div>`;}
function detail(){const t=transactions.find(t=>t.id===state.selected);if(!t)return '';return `<div class="ap-return">${btn('Zurück zu Kontobewegungen','back')}</div><section class="ac-card"><h2>${t.name}</h2>${row(t.date,'CHF '+t.amount)}${done.has(t.id)?`<p role="status">Zugeordnet · einmal im Journal erfasst.</p>${row('Noch zu verteilen','CHF 0.00')}`:t.id==='split'?`<p class="ac-muted">Zahlung auf offene Beträge verteilen</p><label class="ac-field">Alex · Mitgliederbeitrag 2026 (CHF 120.00)<input id="ap-split1" type="number" min="0" max="120" step="0.01" value="120"></label><label class="ac-field">Alex · Essensanteil (CHF 84.00)<input id="ap-split2" type="number" min="0" max="84" step="0.01" value="84"></label><div aria-live="polite">${row('Noch zu verteilen','<span id="ap-rest">CHF 0.00</span>')}</div><p id="ap-error" class="ap-error" role="alert" hidden></p><div class="ac-actions">${btn('Zuordnung speichern','match',true)}</div>`:t.id==='trip'?`<p class="ac-muted">Passende Rechnung</p>${row('Hotel · Jahresausflug','CHF 800.00')}<p>4500 · Reisen und Ausflüge</p><p class="ac-note">Erfasst am 20.09.2026 · Beleg im Vereins-Drive</p><p>Die Zahlung begleicht die bestehende Rechnung. Es entsteht keine zweite Ausgabe.</p><div class="ac-actions">${btn('Mit Rechnung verbinden','match',true)}</div>`:`<label class="ac-field">Ausgabenposten<select><option>4500 · Reisen und Ausflüge</option><option>6100 · Essen mit Vereinskonto</option></select></label><p>Jahresausflug 2026</p><p class="ac-muted">Ohne Belegdatei · Zuordnung möglich</p><div class="ac-actions">${btn('Zuordnung speichern','match',true)}</div>`}</section>`;}
function openAmounts(){return `<h2>Offene Beträge</h2><p class="ac-muted">Ausstehende Einnahmen und noch zu bezahlende Ausgaben · Stand 06.10.2026</p><div class="ac-columns"><section><h2>Noch einzunehmen</h2>${row('Luca · Jahresbeitrag','CHF 120.00')}${row('Nina · Merch-Restbetrag','CHF 40.00')}<p class="ac-note">Merch: Forderung CHF 100.00, bezahlt CHF 60.00.</p>${!done.has('split')?`${row('Alex · Beitrag und Essen','CHF 204.00')}<p class="ac-note">Passender Eingang im Kontoauszug, noch nicht zugeordnet.</p>`:''}<div class="ac-actions">${btn('Kontoabgleich öffnen','bank')}</div></section><section><h2>Noch zu bezahlen</h2>${row('Reisekommissar · Vereinsauslage','CHF 65.00')}<p class="ac-note">Erstattung ausstehend · Belegdatei optional</p>${row('Busunternehmen · Jahresausflug','CHF 300.00')}<p class="ac-note">Fällig 20.10.2026 · Rechnung erfasst</p>${!done.has('trip')?`${row('Hotel · Abgleich ausstehend','CHF 800.00')}<p class="ac-note">Passende Bankbelastung vorhanden. Vor erneuter Zahlung abgleichen.</p>`:''}</section></div><p class="ac-note">Privat untereinander abgerechnete Essen erscheinen nur als Erinnerung beim Anlass.</p>`;}
function feeValue(i){return exceptions[i]?Number(exceptions[i].amount):savedFee;}
function fees(){const count=members.filter((_,i)=>feeValue(i)>0).length;return '<h2>Mitgliederbeiträge 2027</h2><div class="ac-columns"><section class="ac-card"><label class="ac-field">Jahresbeitrag in CHF<input id="ap-fee" type="number" min="0.01" step="0.01" value="'+savedFee+'" '+(feesCreated?'disabled':'')+'></label><label class="ac-field">Zahlungsfrist<input id="ap-due" type="date" value="'+savedDue+'" '+(feesCreated?'disabled':'')+'></label><p class="ac-note">Betrag und Ausnahmen gemäss Vereinsbeschluss. Ausnahmen gelten nur für 2027.</p>'+row('Gesamtsumme','<span id="ap-fee-total">CHF '+money(members.reduce((n,_,i)=>n+feeValue(i),0))+'</span>')+'<div class="ac-actions">'+btn(feesCreated?'Beiträge erstellt':'Beiträge erstellen','create-fees',true,feesCreated)+'</div><p id="ap-fee-error" role="alert" hidden></p>'+(feesCreated?'<p role="status">'+count+' Beiträge einmalig erstellt; '+(11-count)+' befreit. Keine erneute Erstellung.</p>':'')+'</section><section><h2>Mitgliedervorschau</h2>'+members.map((n,i)=>'<section class="ap-budget-row"><strong>'+n+' Beispiel</strong>'+row('Beitrag',feeValue(i)===0?'Befreit':'CHF '+money(feeValue(i)))+(exceptions[i]?'<label class="ac-field">Abweichender Betrag in CHF<input data-exception="'+i+'" type="number" min="0" step="0.01" value="'+escapeText(exceptions[i].amount)+'" '+(feesCreated?'disabled':'')+'></label><label class="ac-field">Begründung<input data-exception-reason="'+i+'" value="'+escapeText(exceptions[i].reason)+'" '+(feesCreated?'disabled':'')+'></label>': '')+(!feesCreated?'<button data-fee-exception="'+i+'">'+(exceptions[i]?'Ausnahme entfernen':'Ausnahme bearbeiten')+'</button>':'')+'</section>').join('')+'</section></div>';}
const positions=[['3000 · Mitgliederbeiträge',1320,1200,1320],['4500 · Reisen und Ausflüge',2000,1500,2200],['6570 · IT, Telefon und Internet',600,520,600]];
function budget(){return `<div class="ac-section-title"><h2>Budgetvergleich</h2><span class="ac-badge">${budgetSaved?'GV-Beschluss 2027 erfasst':'Vorschlag 2027'}</span></div><div class="ac-subnav">${btn('Vorschlag ansehen','proposal')}${btn('GV-Beschluss erfassen','decision')}</div><p class="ac-muted">Alle Werte in CHF · Auszug aus den 18 Posten · Beispieldaten</p>${positions.map((p,i)=>`<section class="ap-budget-row"><strong>${p[0]}</strong><dl class="ap-values"><div><dt>Budget 2026 · beschlossen</dt><dd>${money(p[1])}</dd></div><div><dt>Ist 2026 · bis 06.10.</dt><dd>${money(p[2])}</dd></div><div><dt>Vorschlag 2027</dt><dd>${money(p[3])}</dd></div><div><dt>${state.budgetMode==='decision'?'GV-Beschluss 2027':'Abweichung Ist − Budget'}</dt><dd>${state.budgetMode==='decision'?`<input aria-label="GV-Beschluss ${p[0]} in CHF" id="ap-budget-${i}" type="number" min="0" step="0.01" value="${budgetDraft?budgetDraft[i]:budgetSaved?savedBudget[i]:p[3]}" ${budgetSaved?'disabled':''}>`:money(p[2]-p[1])}</dd></div></dl></section>`).join('')}<p class="ac-note">Ist: bereits zugeordnete Kontobewegungen. Offene Zuordnungen sind noch nicht in den Posten enthalten.</p><p class="ac-note">Noch zu bezahlen: Reise CHF 300.00 und Erstattung CHF 65.00. Offene Beträge werden nicht nochmals als bezahltes Ist gezählt.</p>${state.budgetMode==='decision'?`<label class="ac-field">Datum des GV-Beschlusses<input id="ap-decision-date" type="date" value="${savedDate}" ${budgetSaved?'disabled':''}></label><label class="ac-field">Grund<input id="ap-budget-reason" value="${escapeText(budgetReason)}" ${budgetSaved?'disabled':''}></label><div class="ac-actions">${btn(budgetSaved?'Beschluss gespeichert':'Beschluss festhalten','save-budget',true,budgetSaved)}</div><p class="ac-note">Der ursprüngliche Vorschlag bleibt erhalten. Keine zusätzliche Freigabe in der App.</p><p id="ap-budget-error" role="alert" hidden></p>`:''}${history()}`;}
function history(){if(!versions.length)return '';const chosen=historyPick>=0?versions[historyPick]:null;return '<section class="ac-secondary"><h2>Historie und Vergleich</h2><label class="ac-field">Mit aktuellem Beschluss vergleichen<select id="ap-history"><option value="-1">Ursprünglicher Vorschlag</option>'+versions.map((v,i)=>'<option value="'+i+'" '+(historyPick===i?'selected':'')+'>'+v.date.split('-').reverse().join('.')+' · '+escapeText(v.reason)+'</option>').join('')+'</select></label>'+positions.map((p,i)=>row(p[0],money(chosen?chosen.values[i]:p[3])+' → '+money(savedBudget[i]))).join('')+'<p class="ac-note">Links gewählte Fassung, rechts letzter gespeicherter Beschluss. Erfasst durch Schatzmeister · Beispieldaten.</p><ol>'+versions.map(v=>'<li>'+v.date.split('-').reverse().join('.')+' · '+escapeText(v.reason)+' · Schatzmeister</li>').join('')+'</ol>'+btn('Weitere Budgetänderung erfassen','amend-budget',false,!budgetSaved)+'</section>';}
function year(){return `<h2>Jahresabschluss 2026 vorbereiten</h2><p class="ac-muted">Zwischenstand zum 06.10.2026 · noch kein vollständiger Jahresauszug</p><ul class="ac-checks"><li><div><strong>Bankkonto abstimmen</strong><small>${3-done.size} Bewegungen noch zuzuordnen. Auszüge bis 31.12. fehlen in diesem Beispiel.</small></div></li><li><div><strong>Offene Beträge ausweisen</strong><small>Ausstehende Einnahmen und unbezahlte Rechnungen separat erhalten.</small></div></li><li><div><strong>Belege und Angaben prüfen</strong><small>Eine fehlende Belegdatei allein blockiert den Abschluss nicht.</small></div></li><li><div><strong>Revision dokumentieren</strong><small>Revisor prüft; Systemadmin kann mit sichtbarem Vermerk stellvertretend bestätigen. Kein Selbsttestat des Schatzmeisters.</small></div></li></ul><div class="ac-actions">${btn('Offene Zuordnungen bearbeiten','bank',true)}${btn('Offene Beträge ansehen','open')}</div><section class="ac-secondary"><h2>Nach dem Abschluss</h2><p class="ac-muted">Schatzmeister oder Systemadmin können das Jahr allein mit dokumentiertem Grund wiederöffnen. Frühere Berichte bleiben erhalten; anschliessend folgt eine erneute Revision.</p><p class="ac-note">Rechnung im Dezember, Bankzahlung im Januar: Ausgabe im neuen Jahr; zum alten Jahresende weiterhin als offen ausgewiesen.</p></section>`;}
function draw(){app.dataset.view=state.view;root.style.colorScheme=state.theme==='auto'?'light dark':state.theme;theme.setAttribute('aria-checked',String(state.theme==='dark'||state.theme==='auto'&&system.matches));root.querySelectorAll('button[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));root.querySelectorAll('[data-area]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.area===state.area)));root.querySelector('#ap-area').value=state.area;content.innerHTML=({bank,open:openAmounts,fees,budget,year}[state.area])();root.querySelector('.gf-feedback').hidden=true;root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));globalThis.lucide?.createIcons({attrs:{width:20,height:20}});}
function go(area){state.area=area;state.selected=null;draw();save();}
root.addEventListener('input',e=>{const el=e.target;if(el.id==='ap-fee')savedFee=Number(el.value);if(el.id==='ap-due')savedDue=el.value;if(el.dataset.exception!==undefined)exceptions[el.dataset.exception].amount=el.value;if(el.dataset.exceptionReason!==undefined)exceptions[el.dataset.exceptionReason].reason=el.value;if(el.id==='ap-budget-reason')budgetReason=el.value;if(el.id==='ap-decision-date')savedDate=el.value;if(/^ap-budget-[0-2]$/.test(el.id)){if(!budgetDraft)budgetDraft=[...savedBudget];budgetDraft[Number(el.id.slice(-1))]=el.value;}const t=root.querySelector('#ap-fee-total');if(t)t.textContent='CHF '+money(members.reduce((n,_,i)=>n+feeValue(i),0));});
root.addEventListener('change',e=>{if(e.target.id==='ap-history'){historyPick=Number(e.target.value);draw();}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.feeException!==undefined){e.stopImmediatePropagation();const i=b.dataset.feeException;if(exceptions[i])delete exceptions[i];else exceptions[i]={amount:savedFee,reason:''};draw();root.querySelector('[data-fee-exception="'+i+'"]').focus({preventScroll:true});return;}if(b.dataset.action==='amend-budget'){e.stopImmediatePropagation();budgetDraft=[...savedBudget];budgetSaved=false;budgetReason='';state.budgetMode='decision';draw();return;}if(b.dataset.action==='create-fees'&&!feesCreated){const bad=Object.values(exceptions).some(x=>x.amount===''||!Number.isFinite(Number(x.amount))||Number(x.amount)<0||Math.abs(Number(x.amount)*100-Math.round(Number(x.amount)*100))>0.00001||!x.reason.trim());if(bad){e.stopImmediatePropagation();const err=root.querySelector('#ap-fee-error');err.hidden=false;err.textContent='Bitte gültigen Ausnahmebetrag und Begründung ergänzen.';err.scrollIntoView({block:'nearest'});}}if(b.dataset.action==='save-budget'&&!budgetReason.trim()){e.stopImmediatePropagation();const err=root.querySelector('#ap-budget-error');err.hidden=false;err.textContent='Bitte den Grund ergänzen.';root.querySelector('#ap-budget-reason').focus();}},true);
root.addEventListener('change',e=>{if(e.target.id==='ap-area')go(e.target.value);});
root.addEventListener('input',e=>{if(['ap-split1','ap-split2'].includes(e.target.id)){const a=Number(root.querySelector('#ap-split1').value),b=Number(root.querySelector('#ap-split2').value);root.querySelector('#ap-rest').textContent='CHF '+money(204-a-b);}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;draw();save();return;}if(b===theme){state.theme=theme.getAttribute('aria-checked')==='true'?'light':'dark';root.style.colorScheme=state.theme;theme.setAttribute('aria-checked',String(state.theme==='dark'));save();return;}if(b===account){menu.hidden=!menu.hidden;account.setAttribute('aria-expanded',String(!menu.hidden));return;}if(b.dataset.area){go(b.dataset.area);return;}if(b.dataset.transaction){state.selected=b.dataset.transaction;draw();return;}const a=b.dataset.action;if(a==='back'){state.selected=null;draw();return;}if(a==='bank'||a==='open'){go(a);return;}if(a==='import'){imported=true;draw();return;}if(a==='match'){if(state.selected==='split'){const v1=root.querySelector('#ap-split1'),v2=root.querySelector('#ap-split2');if(!v1.value||!v2.value||!v1.checkValidity()||!v2.checkValidity()||Math.abs(Number(v1.value)+Number(v2.value)-204)>.001){const err=root.querySelector('#ap-error');err.hidden=false;err.textContent='Bitte CHF 204.00 vollständig auf die beiden offenen Beträge verteilen.';return;}}done.add(state.selected);draw();return;}if(a==='create-fees'){const fee=root.querySelector('#ap-fee'),due=root.querySelector('#ap-due');if(!fee.value||!fee.checkValidity()||!due.value){const err=root.querySelector('#ap-fee-error');err.hidden=false;err.textContent='Bitte gültigen Betrag und Zahlungsfrist eingeben.';return;}savedFee=Number(fee.value);savedDue=due.value;feesCreated=true;draw();return;}if(a==='proposal'||a==='decision'){state.budgetMode=a;draw();save();return;}if(a==='save-budget'){const inputs=[...root.querySelectorAll('[id^="ap-budget-"]')].filter(x=>x.tagName==='INPUT');if(inputs.some(x=>!x.value||!x.checkValidity())||!root.querySelector('#ap-decision-date').value){const err=root.querySelector('#ap-budget-error');err.hidden=false;err.textContent='Bitte gültige Beträge und Beschlussdatum eingeben.';return;}savedBudget=inputs.map(x=>Number(x.value));savedDate=root.querySelector("#ap-decision-date").value;budgetSaved=true;versions.push({date:savedDate,reason:budgetReason,values:[...savedBudget]});budgetDraft=null;draw();feedback('Beschluss in dieser Vorschau festgehalten. Keine Vereinsdaten geändert.');return;}if(b.dataset.go){closeMenu();feedback('Vorschau: Hier führt die Navigation zum gewählten Vereinsbereich.');}});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){closeMenu();account.focus();}});document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target)&&!account.contains(e.target))closeMenu();});system.addEventListener('change',()=>{if(state.theme==='auto')theme.setAttribute('aria-checked',String(system.matches));});window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState?.modelContent);draw();});draw();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:draw});tweak.addSelect(state,'view',{label:'Ansicht',options:[{label:'Mobile',value:'mobile'},{label:'Tablet',value:'tablet'},{label:'Desktop',value:'desktop'}]});tweak.addSelect(state,'area',{label:'Arbeitsbereich',options:[{label:'Kontoabgleich',value:'bank'},{label:'Offene Beträge',value:'open'},{label:'Beiträge',value:'fees'},{label:'Budget & GV',value:'budget'},{label:'Jahresabschluss',value:'year'}]});}
})();
</script>
