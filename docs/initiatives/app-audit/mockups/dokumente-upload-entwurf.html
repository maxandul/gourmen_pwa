function listHTML(){const searching=!!state.term,list=files.filter(f=>f.archived===state.archive&&(searching?f.name.toLocaleLowerCase('de').includes(state.term.toLocaleLowerCase('de')):state.archive||f.folder===state.folder)),children=searching||state.archive?[]:folders.filter(f=>f.parent===state.folder);return `<div class="dc-actions">${!state.readOnly&&!state.archive?'<button class="gf-primary" id="dc-upload">'+icon('upload')+'Datei hochladen</button>':''}<button id="dc-archive">${state.archive?'Aktive Dokumente':'Archiv'}</button></div><form class="dc-search" id="dc-search"><label>In allen ${state.archive?'archivierten':'aktiven'} Dokumenten suchen<input id="dc-query" type="search" value="${esc(state.term)}" placeholder="Dateiname eingeben"></label><button type="submit">${icon('search')}Suchen</button>${searching?'<button type="button" id="dc-clear">Zurücksetzen</button>':''}</form><div class="dc-layout"><nav class="dc-foldernav" aria-label="Dokumentordner">${folders.map(f=>`<button data-folder="${f.id}" ${state.folder===f.id?'aria-current="location"':''} style="padding-left:${f.parent==='club'||f.parent==='events'?24:12}px">${icon('folder')}${f.name}</button>`).join('')}</nav><section class="dc-panel"><h2>${searching?'Suchergebnisse':state.archive?'Archiv':folder(state.folder).name}</h2>${!searching&&!state.archive&&state.folder!=='root'?'<button id="dc-parent" class="dc-link">'+icon('arrow-left')+'Zu '+folder(folder(state.folder).parent).name+'</button>':''}${children.map(f=>`<div class="dc-row"><button class="dc-link" data-folder="${f.id}">${icon('folder')}<span class="dc-filetitle">${f.name}</span></button><span class="dc-tag">Ordner</span></div>`).join('')}${list.map(f=>`<div class="dc-row"><div><button class="dc-link" data-file="${f.id}">${icon('file-text')}<span class="dc-filetitle">${esc(f.name)}</span></button><p class="dc-muted">${searching||state.archive?esc(path(f.folder))+' · ':''}PDF · ${f.size}</p></div><span class="dc-tag">${f.archived?'Archiviert':'10. Oktober'}</span></div>`).join('')}${!children.length&&!list.length?'<p class="dc-muted">'+(searching?'Keine passenden Dokumente gefunden.':state.archive?'Das Archiv ist leer.':'Dieser Ordner ist noch leer.')+'</p>':''}</section></div>`}
function detailHTML(){const f=doc();return `<button class="dc-link" id="dc-back">${icon('arrow-left')}Zur Dokumentübersicht</button><div class="dc-detail"><section class="dc-paper" aria-label="Beispielvorschau"><span class="dc-muted">PDF · Beispielvorschau</span><h2 style="margin-top:24px">${esc(f.name.replace('.pdf',''))}</h2><p>Gourmen Verein</p><p>${f.id===2?'Generalversammlung 2026<br>1. Begrüssung<br>2. Vereinsjahr und Ausblick<br>3. Beschlüsse und nächste Termine':'Dokumentinhalt als Platzhalter.'}</p><p class="dc-muted">Keine echte Datei geöffnet.</p></section><aside class="dc-panel"><h2>Dokumentdetails</h2><dl><dt>Ablage</dt><dd>${esc(path(f.folder))}</dd><dt>Datei</dt><dd>PDF · ${f.size}</dd><dt>Status</dt><dd>${f.archived?'Archiviert':'Aktiv'}</dd></dl><button id="dc-open" class="gf-primary">${icon('external-link')}Datei öffnen</button>${!state.readOnly?`<div class="dc-actions">${f.archived?'<button id="dc-restore">Wiederherstellen</button>':'<button id="dc-rename">'+icon('pencil')+'Umbenennen</button><button id="dc-move">'+icon('folder-input')+'Verschieben</button>'}</div>${!f.archived?'<button id="dc-doarchive" class="dc-link">Archivieren</button>':''}`:''}</aside></div>`}
function uploadHTML(){const busy=upload==='sending',locked=busy||upload==='unknown'||upload==='saved';return `<div class="dc-upload"><button id="dc-back" class="dc-link">${icon('arrow-left')}Zurück zu ${esc(folder(state.folder).name)}</button><div class="dc-panel"><h2>Datei und Angaben</h2><p class="dc-muted">${draft.file?'Protokoll Vorstand Oktober.pdf · PDF · 420 KB':'Noch keine Datei ausgewählt.'}</p><button id="dc-select" ${locked?'disabled':''}>${icon('paperclip')}${draft.file?'Beispieldatei neu auswählen':'Beispieldatei auswählen'}</button><label>Titel<input id="dc-title" value="${esc(draft.title)}" ${locked?'disabled':''}></label><label>Zielordner<span class="dc-path">${esc(path(draft.target))}</span></label><button id="dc-choose" ${locked?'disabled':''}>${icon('folder')}Zielordner ändern</button><p id="dc-error" role="alert" hidden></p>${busy?'<p role="status">Datei wird übertragen … <span id="dc-pct">'+progress+'</span> %</p><progress max="100" value="'+progress+'" aria-label="Uploadfortschritt"></progress>':''}${upload==='failed'?'<div class="dc-note" role="alert">Übertragung fehlgeschlagen. Die Datei wurde nicht gespeichert. Angaben und Auswahl bleiben erhalten.</div>':''}${upload==='unknown'?'<div class="dc-note" role="alert">Datei übertragen, Speicherung noch nicht bestätigt. Bitte zuerst den Status prüfen.</div>':''}${upload==='saved'?'<div class="dc-note" role="status">Datei gespeichert. Du findest sie im gewählten Zielordner.</div>':''}<div class="dc-actions">${upload==='saved'?'<button class="gf-primary" id="dc-result">Im Ordner anzeigen</button>':upload==='unknown'?'<button class="gf-primary" id="dc-check">Speicherstand prüfen</button>':`<button class="gf-primary" id="dc-send" ${busy?'disabled':''}>${upload==='failed'?'Erneut hochladen':'Hochladen'}</button>`}<button id="dc-abort" ${busy||upload==='unknown'?'disabled':''}>${upload==='saved'?'Zur Übersicht':'Abbrechen'}</button></div></div></div>`}
function pickerHTML(){const f=folder(pickFolder);return `<div class="dc-upload"><button id="dc-picker-cancel" class="dc-link">${icon('arrow-left')}${pickPurpose==='upload'?'Zurück zum Upload':'Zurück zum Dokument'}</button><section class="dc-panel"><h2>Zielordner wählen</h2><p class="dc-path">Ausgewählt: ${esc(path(pickFolder))}</p>${f.parent?'<button id="dc-picker-parent" class="dc-link">'+icon('arrow-left')+'Zu '+folder(f.parent).name+'</button>':''}${folders.filter(x=>x.parent===pickFolder).map(x=>`<div class="dc-row"><button class="dc-link" data-pickfolder="${x.id}">${icon('folder')}${x.name}</button></div>`).join('')}${!folders.some(x=>x.parent===pickFolder)?'<p class="dc-muted">Keine Unterordner vorhanden.</p>':''}<div class="dc-actions"><button class="gf-primary" id="dc-picker-use">${pickPurpose==='upload'?'Diesen Ordner verwenden':'Hierhin verschieben'}</button><button id="dc-picker-cancel2">Abbrechen</button></div></section></div>`}
function render(){const title=state.page==='detail'?doc().name:state.page==='upload'?'Datei hochladen':state.page==='picker'?'Zielordner':state.page==='rename'?'Dokument umbenennen':'Dokumente';q('#dc-top').innerHTML='<h1>'+esc(title)+'</h1>';q('#dc-notice').hidden=!notice;q('#dc-notice').textContent=notice;if(lastArchive&&notice)q('#dc-notice').insertAdjacentHTML('beforeend',' <button id="dc-undo" class="dc-link">Rückgängig</button>');let content=state.page==='list'?listHTML():state.page==='detail'?detailHTML():state.page==='upload'?uploadHTML():state.page==='picker'?pickerHTML():`<div class="dc-panel dc-upload"><label>Dokumenttitel<input id="dc-newname" value="${esc(rename)}"></label><p id="dc-error" role="alert" hidden></p><div class="dc-actions"><button id="dc-rename-save" class="gf-primary">Speichern</button><button id="dc-rename-cancel">Abbrechen</button></div></div>`;if(state.health!=='normal'){content='<div class="dc-note" role="status">'+(state.health==='offline'?'Offline · Angezeigter Bestand vom letzten Abruf. Änderungen und Dateiabruf sind nicht verfügbar.':'Dokumente konnten nicht aktualisiert werden. Der zuletzt geladene Bestand bleibt sichtbar.')+' <button id="dc-reload">Erneut prüfen</button></div>'+content}q('#dc-content').innerHTML=content;chrome()}
function error(t,id){q('#dc-error').hidden=false;q('#dc-error').textContent=t;if(id)q(id)?.focus()}function online(){if(state.health==='normal')return true;notice='Verbindung erforderlich. Deine Angaben bleiben erhalten.';render();return false}function insert(){if(!files.some(f=>f.uploadKey==='example-upload-'+uploadSequence))files.push({id:10+uploadSequence,name:draft.title.endsWith('.pdf')?draft.title:draft.title+'.pdf',folder:draft.target,size:'420 KB',archived:false,uploadKey:'example-upload-'+uploadSequence});upload='saved';dirty=false;render()}
function startUpload(){if(!draft.file){error('Bitte zuerst eine Datei auswählen.','#dc-select');return}if(!draft.title.trim()){error('Bitte einen Titel eingeben.','#dc-title');return}if(!online())return;if(files.some(f=>!f.archived&&f.folder===draft.target&&f.name.toLowerCase()===(draft.title.endsWith('.pdf')?draft.title:draft.title+'.pdf').toLowerCase()&&f.uploadKey!=='example-upload-'+uploadSequence)){error('Eine Datei mit diesem Namen existiert bereits. Bitte den Titel ändern.','#dc-title');return}upload='sending';progress=0;render();const current=++token;const tick=()=>{if(current!==token)return;progress+=25;if(progress<100){q('progress').value=progress;q('#dc-pct').textContent=progress;setTimeout(tick,180)}else if(state.outcome==='failed'){upload='failed';render()}else if(state.outcome==='unknown'){upload='unknown';render()}else insert()};setTimeout(tick,180)}
root.addEventListener('submit',e=>{if(e.target.id!=='dc-search')return;e.preventDefault();state.term=q('#dc-query').value.trim();render();q('#dc-query').focus();save()});root.addEventListener('input',e=>{if(e.target.id==='dc-title'){draft.title=e.target.value;dirty=true}if(e.target.id==='dc-newname')rename=e.target.value});root.addEventListener('change',e=>{if(e.target.id==='dc-health'){state.health=e.target.value;render();save()}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;chrome();save();return}if(b.hasAttribute('data-theme-toggle')){state.theme=b.getAttribute('aria-checked')==='true'?'light':'dark';chrome();save();return}if(b.id==='dc-cancel'){q('#dc-dialog').close();return}if(b.id==='dc-confirm'){q('#dc-dialog').close();pending?.();return}if(b.id==='dc-reload'){state.health='normal';notice='Beispielbestand aktualisiert.';render();save();return}if(b.classList.contains('gf-account')){q('.gf-account-panel').hidden=!q('.gf-account-panel').hidden;b.setAttribute('aria-expanded',!q('.gf-account-panel').hidden);return}if(b.dataset.go){leave(()=>{state.page='list';notice='Dieser Bereich gehört zu einem anderen Entwurf.';nav()});return}if(b.dataset.folder){state.folder=b.dataset.folder;state.archive=false;state.term='';notice='';nav('#dc-query');return}if(b.id==='dc-parent'){state.folder=folder(state.folder).parent;nav('#dc-query');return}if(b.id==='dc-clear'){state.term='';nav('#dc-query');return}if(b.id==='dc-archive'){state.archive=!state.archive;state.term='';notice='';nav('#dc-query');return}if(b.dataset.file){selected=+b.dataset.file;state.page='detail';notice='';nav('#dc-back');return}if(b.id==='dc-back'||b.id==='dc-abort'){leave(()=>{state.page='list';notice='';nav('#dc-query')});return}if(b.id==='dc-upload'){uploadSequence++;draft={title:'',file:false,target:state.folder};dirty=false;upload='idle';state.page='upload';notice='';nav('#dc-select');return}if(b.id==='dc-select'){draft.file=true;if(!draft.title)draft.title='Protokoll Vorstand Oktober';dirty=true;upload='idle';render();q('#dc-title').focus();return}if(b.id==='dc-choose'||b.id==='dc-move'){pickPurpose=b.id==='dc-choose'?'upload':'move';returnPage=state.page;pickFolder=pickPurpose==='upload'?draft.target:doc().folder;state.page='picker';nav('#dc-picker-cancel');return}if(b.dataset.pickfolder){pickFolder=b.dataset.pickfolder;nav('#dc-picker-use');return}if(b.id==='dc-picker-parent'){pickFolder=folder(pickFolder).parent;nav('#dc-picker-use');return}if(b.id==='dc-picker-cancel'||b.id==='dc-picker-cancel2'){state.page=returnPage;nav(pickPurpose==='upload'?'#dc-choose':'#dc-move');return}if(b.id==='dc-picker-use'){if(pickPurpose==='upload'){draft.target=pickFolder;dirty=true;state.page='upload';nav('#dc-choose')}else if(online()){doc().folder=pickFolder;state.page='detail';notice='Dokument verschoben · Vorschau';nav('#dc-move')}return}if(b.id==='dc-send'){startUpload();return}if(b.id==='dc-check'){if(online()){insert();notice='Speicherstand geprüft: Datei ist vorhanden. Kein zweiter Upload.';render()}return}if(b.id==='dc-result'){state.folder=draft.target;state.page='list';state.term='';state.archive=false;notice='Datei gespeichert · Vorschau';nav('[data-file="'+(10+uploadSequence)+'"]');return}if(b.id==='dc-open'){notice=state.health==='normal'?'In der App öffnet sich hier die Originaldatei. Diese Vorschau verwendet keine echte Datei.':'Die Originaldatei benötigt eine Verbindung.';render();return}if(b.id==='dc-rename'){rename=doc().name;state.page='rename';nav('#dc-newname');return}if(b.id==='dc-rename-cancel'){state.page='detail';nav('#dc-rename');return}if(b.id==='dc-rename-save'){if(!rename.trim()){error('Bitte einen Namen eingeben.','#dc-newname');return}if(!online())return;doc().name=rename.trim();state.page='detail';notice='Name geändert · Vorschau';nav('#dc-rename');return}if(b.id==='dc-doarchive'){confirm('Dokument archivieren?',doc().name+' wird aus der aktiven Übersicht ins Archiv verschoben. Die Datei bleibt erhalten.',()=>{if(!online())return;doc().archived=true;lastArchive=selected;state.page='list';notice='Dokument archiviert.';nav('#dc-query')},'Archivieren');return}if(b.id==='dc-undo'){files.find(f=>f.id===lastArchive).archived=false;lastArchive=null;notice='Archivierung rückgängig gemacht.';render();return}if(b.id==='dc-restore'){if(!online())return;doc().archived=false;notice='Dokument wiederhergestellt.';render();return}});
window.addEventListener('openai:set_globals',e=>{if(upload==='sending')return;restore(e.detail?.globals?.widgetState?.modelContent);render()});restore(window.openai?.widgetState?.modelContent);render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addSelect(state,'outcome',{label:'Upload-Ausgang',options:[{label:'Erfolgreich',value:'success'},{label:'Fehlgeschlagen',value:'failed'},{label:'Speicherstand unklar',value:'unknown'}]});t.addToggle(state,'readOnly',{label:'Nur Lesen – Darstellungsbeispiel'})}
})();
</script>
