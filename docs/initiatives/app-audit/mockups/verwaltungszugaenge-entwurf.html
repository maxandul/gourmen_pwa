<script>
(()=>{

html=`<div class="vz-grid"><section class="vz-panel"><h2>Vereinsdokumente in Google Drive</h2><span class="vz-badge">${badge}</span>`;
if(['empty','edit','mailerror'].includes(google))html+=`<form id="vz-google-form" novalidate><label>Google-Adresse<input id="vz-email" type="email" autocomplete="off" value="${esc(email)}" placeholder="alex@example.invalid"></label><p class="pr-help">Verwende die Adresse deines Google-Kontos.</p>${google==='edit'?'<p class="pr-warning">Für die neue Adresse ist eine eigene Bestätigung nötig. Ein vorhandener Drive-Zugang zur alten Adresse muss separat geprüft werden.</p>':''}<div class="vz-actions"><button type="submit" class="gf-primary">${google==='mailerror'?'Bestätigung erneut anfordern':'Bestätigung anfordern'}</button>${google==='edit'?'<button type="button" data-act="google-cancel">Abbrechen</button>':''}</div></form>`;
else html+=`<p>${esc(email)}</p><p>${google==='pending'?'Öffne den Bestätigungslink in deinem Postfach.':google==='verified'?'Die Adresse ist bestätigt. Der Drive-Zugang ist noch nicht bestätigt.':google==='invited'?'Die Einladung wurde angestossen. Ein bestätigter Zugriff liegt noch nicht vor.':google==='inviteerror'?'Deine Adresse bleibt bestätigt. Nur die Einladung muss erneut versucht werden.':'Der Zugriff auf die Vereinsdokumente ist bestätigt.'}</p><div class="vz-actions">${google==='pending'?'<button data-act="verify">Beispiellink öffnen</button><button data-act="resend">Bestätigung erneut anfordern</button>':google==='verified'?'<button data-act="invite" class="gf-primary">Drive-Einladung anfordern</button>':google==='inviteerror'?'<button data-act="invite" class="gf-primary">Einladung erneut versuchen</button>':google==='invited'?'<button data-act="check">Beispielstatus prüfen</button>':''}<button data-act="google-edit">Adresse ändern</button></div>`;
html+=`</section><aside class="vz-panel"><h2>Zwei getrennte Bestätigungen</h2><div class="vz-row"><strong>1. Adresse bestätigen</strong><p>Nachweis, dass die Adresse dir gehört.</p></div><div class="vz-row"><strong>2. Drive-Zugang prüfen</strong><p>Einladung und tatsächlicher Zugriff sind eigene Zustände.</p></div><p class="pr-help">Eine Änderung hier ersetzt nicht dein Passwort für die Gourmen-App.</p></aside></div>`;
}
if(state.example==='calendar')html=`<div class="vz-grid"><section class="vz-panel"><h2>Dein persönliches Abonnement</h2><span class="vz-badge">${calendar==='active'?'Aktiv':'Deaktiviert'}</span><p>Verwende den persönlichen Link in deiner Kalender-App.</p>${calendar==='active'?`<div class="vz-placeholder">Persönlicher Kalenderlink · Beispiel ${generation}<br><small>Platzhalter, kein gültiger Link</small></div><div class="vz-actions"><button data-act="copy">Link kopieren</button><button data-act="renew">Link erneuern</button><button data-act="disable">Deaktivieren</button></div>`:'<p>Über den bisherigen Link werden keine neuen Kalenderdaten mehr bereitgestellt.</p><button data-act="enable" class="gf-primary">Neuen Kalenderzugang aktivieren</button>'}</section><aside class="vz-panel"><h2>Was eine Änderung bewirkt</h2><p>Nach dem Erneuern musst du das Abonnement mit dem neuen Link in deiner Kalender-App einrichten.</p><p class="pr-help">Bereits heruntergeladene Termine können dort weiterhin sichtbar sein. Sichtbarkeit einzelner Veranstaltungen folgt deinen Zugriffsrechten.</p></aside></div>`;
if(state.example==='member')html=`<div class="vz-grid"><section class="vz-panel">${member==='new'?`<h2>Neues Mitglied</h2><form id="vz-member-form" novalidate><label>Anzeigename<input id="vz-name" value="${esc(memberName)}" autocomplete="off"></label><label>E-Mail<input id="vz-member-email" type="email" value="${esc(memberEmail)}" autocomplete="off" placeholder="mitglied@example.invalid"></label><p class="pr-help">Beispielausschnitt der Mitgliederanlage. Weitere Profilangaben folgen dem bestätigten Formularmuster.</p><button type="submit" class="gf-primary">Mitglied anlegen und einladen</button></form>`:`<h2>${esc(memberName)}</h2><p>${esc(memberEmail)}</p><span class="vz-badge">Mitglied angelegt</span><h3>${member==='failed'?'Einladung nicht versendet':member==='sent'?'Aktivierung ausstehend':'Zugang eingerichtet'}</h3><p>${member==='failed'?'Das Mitglied ist gespeichert. Wiederhole nur den Versand.':member==='sent'?'Die Einladung ist versendet. Das Mitglied hat den Zugang noch nicht eingerichtet.':'Das Mitglied hat die Einladung angenommen und den Zugang eingerichtet. · Beispiel'}</p><div class="vz-actions">${member==='failed'?'<button data-act="member-resend" class="gf-primary">Einladung erneut senden</button>':member==='sent'?'<button data-act="member-activate">Beispielaktivierung zeigen</button>':''}</div>`}</section><aside class="vz-panel"><h2>Zugang und Mitglied getrennt</h2><p>Ein Versandfehler legt kein zweites Mitglied an.</p><p>Die Einladung führt zur bereits gezeigten Einrichtung des persönlichen Passworts.</p><p class="pr-help">Rolle, Vereinsfunktion und sensible Profilangaben sind eigene Bereiche. Zuständigkeiten werden mit F2 festgelegt.</p></aside></div>`;
if(state.example==='roles')html=`<div class="vz-grid"><section class="vz-panel"><h2>Alex Beispiel</h2><span class="vz-badge">${role==='admin'?'Administrator':'Mitglied'}</span><p>${state.lastAdmin&&role==='admin'?'Einziger aktiver Administrator':'Weitere aktive Administration vorhanden · Beispiel'}</p><div class="vz-actions"><button data-act="role" ${state.lastAdmin&&role==='admin'?'disabled':''}>${role==='admin'?'Adminrecht entfernen':'Adminrecht erteilen'}</button><button data-act="deactivate" ${state.lastAdmin&&role==='admin'?'disabled':''}>Mitglied deaktivieren</button></div>${state.lastAdmin&&role==='admin'?'<p class="pr-warning">Zuerst einer weiteren aktiven Person die Administration übertragen. Der letzte aktive Admin bleibt erhalten.</p>':''}</section><aside class="vz-panel"><h2>Folgen getrennt prüfen</h2><div class="vz-row"><strong>App-Zugang</strong><p>Rolle und Vereinsfunktion bestimmen unterschiedliche Rechte.</p></div><div class="vz-row"><strong>Google und Kalender</strong><p>Externe Freigaben und persönliche Links müssen beim Entzug separat berücksichtigt werden.</p></div><p class="pr-help">Gestaltungsvorschlag. Umfang des Widerrufs und zulässige Rollenänderungen werden unter F1/F2 entschieden.</p></aside></div>`;
q('#vz-content').innerHTML=html;chrome();}
function fail(text,el){q('#vz-error').hidden=false;q('#vz-error').textContent=text;el?.focus();q('#vz-error').scrollIntoView({block:'center'})}
function dialog(title,text,fn){pending=fn;q('#vz-dialog-title').textContent=title;q('#vz-dialog-text').textContent=text;q('#vz-dialog').showModal()}
function change(example){state.example=example;notice='';dirty=false;render();q('#vz-title').scrollIntoView({block:'start'});save()}
root.addEventListener('input',e=>{if(e.target.id==='vz-email'){email=e.target.value;dirty=true}if(e.target.id==='vz-name'){memberName=e.target.value;dirty=true}if(e.target.id==='vz-member-email'){memberEmail=e.target.value;dirty=true}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='vz-google-form'){const el=q('#vz-email');if(!email.trim()||!el.validity.valid)return fail('Bitte eine gültige Google-Adresse eingeben.',el);google=state.mailFail?'mailerror':'pending';dirty=false;notice=state.mailFail?'Bestätigung konnte nicht versendet werden.':'Bestätigung angefordert · nur Vorschau';render()}if(e.target.id==='vz-member-form'){const el=q('#vz-member-email');if(!memberName.trim())return fail('Bitte den Namen ergänzen.',q('#vz-name'));if(!memberEmail.trim()||!el.validity.valid)return fail('Bitte eine gültige E-Mail-Adresse eingeben.',el);member=state.mailFail?'failed':'sent';dirty=false;render()}});
root.addEventListener('change',e=>{if(e.target.id==='vz-example'){const next=e.target.value;e.target.value=state.example;if(dirty)dialog('Ungespeicherte Angaben verwerfen?','Beim Wechsel des Beispiels werden diese Angaben verworfen.',()=>{if(member==='new'){memberName='';memberEmail=''}if(google==='empty'||google==='edit'){email=priorEmail;google=priorGoogle}change(next)});else change(next)}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;chrome();save();return}if(b.hasAttribute('data-theme-toggle')){state.theme=b.getAttribute('aria-checked')==='true'?'light':'dark';chrome();save();return}if(b.classList.contains('gf-account')){const p=q('.gf-account-panel');p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden));return}if(b.dataset.go){q('#vz-status').textContent='Die Navigation führt in der App zur jeweiligen Übersicht. Dieser Entwurf zeigt die Zugangsverwaltung.';return}if(b.id==='vz-cancel'){q('#vz-dialog').close();return}if(b.id==='vz-confirm'){q('#vz-dialog').close();pending?.();return}
switch(b.dataset.act){case'verify':google='verified';verified=email;notice='Beispieladresse bestätigt. Noch kein Nachweis für Drive-Zugriff.';break;case'resend':google=state.mailFail?'mailerror':'pending';notice='Nur Beispielversand; keine echte Nachricht.';break;case'invite':google=state.mailFail?'inviteerror':'invited';break;case'check':google='active';notice='Erfolgreicher Zugriff als Beispiel dargestellt.';break;case'google-edit':priorGoogle=google;priorEmail=email;google='edit';break;case'google-cancel':email=priorEmail;google=priorGoogle;dirty=false;break;case'copy':notice='Nur Platzhalter: Es wurde kein Kalenderlink in die Zwischenablage kopiert.';break;case'renew':return dialog('Kalenderlink erneuern?','Der bisherige Link wird ungültig. Richte das Abonnement anschliessend mit dem neuen Link ein.',()=>{generation++;notice='Neuer Beispiellink erstellt. Alter Link ungültig.';render()});case'disable':return dialog('Kalenderzugang deaktivieren?','Der Link liefert keine neuen Daten mehr. Bereits geladene Termine werden nicht aus deiner Kalender-App gelöscht.',()=>{calendar='disabled';notice='Kalenderzugang deaktiviert · Vorschau';render()});case'enable':calendar='active';generation++;notice='Neuer Zugang aktiviert. Abonnement neu einrichten.';break;case'member-resend':member=state.mailFail?'failed':'sent';notice='Bestehendes Mitglied beibehalten. Nur Einladung erneut versucht.';break;case'member-activate':member='active';break;case'role':if(state.lastAdmin&&role==='admin')return;return dialog('Rollenänderung vorbereiten','Die konkrete Freigabe und Wirkung auf bestehende Sitzungen ist unter F1/F2 noch offen. Dieser Entwurf zeigt nur die Änderungsvorschau.',()=>{notice='Rollenänderung vorbereitet. Noch keine Berechtigung geändert.';render()});case'deactivate':if(state.lastAdmin&&role==='admin')return;return dialog('Deaktivierung vorbereiten','App-Zugang, Kalenderlink und externe Drive-Freigaben müssen gemeinsam geprüft werden. Die genaue Widerrufsregel ist noch offen.',()=>{notice='Deaktivierung zur Prüfung vorbereitet. Kein Zugang geändert.';render()});default:return}render();});
restore(window.openai?.widgetState?.modelContent);render();window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState?.modelContent);render()});
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addToggle(state,'mailFail',{label:'Versand-/Einladungsfehler simulieren'});t.addToggle(state,'lastAdmin',{label:'Einziger aktiver Admin'})}
})();
</script>
