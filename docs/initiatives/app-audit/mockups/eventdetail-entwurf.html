<script>
(()=>{
const root=document.getElementById('gourmen-event'),app=root.querySelector('.gf-app'),toggle=root.querySelector('[data-theme-toggle]'),account=root.querySelector('.gf-account'),menu=root.querySelector('.gf-account-panel'),panel=root.querySelector('#ev-panel');
const state={view:'mobile',theme:'auto',stage:'before',tab:'participation',role:'member',pay:'club',rsvp:'open',food:'normal',guess:'840.00',saved:false,rated:false,review:false};
const rating={food:'',drinks:'',service:''};
const system=matchMedia('(prefers-color-scheme: dark)');
const restore=s=>{if(s?.design!=='event-detail-v3')return;for(const [k,allowed] of Object.entries({view:['mobile','tablet','desktop'],theme:['auto','light','dark'],stage:['before','during','after'],tab:['participation','billbro','ratings'],role:['member','organizer'],pay:['club','private']}))if(allowed.includes(s[k]))state[k]=s[k];};
restore(window.openai?.widgetState?.modelContent);
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const button=(label,action,primary=false)=>`<button data-action="${action}" class="${primary?'gf-primary':''}">${label}</button>`;
const badge=(label,type='')=>`<span class="ev-state ${type?'ev-state--'+type:''}">${label}</span>`;
function close(focus=false){menu.hidden=true;account.setAttribute('aria-expanded','false');if(focus)account.focus();}
function save(){window.openai?.setWidgetState?.({modelContent:{design:'event-detail-v3',view:state.view,theme:state.theme,stage:state.stage,tab:state.tab,role:state.role,pay:state.pay},privateContent:null})?.catch(()=>{});}
function feedback(text){const f=root.querySelector('.gf-feedback');f.textContent=text;f.hidden=false;}
function participation(){const done=state.stage==='after',joined=state.rsvp==='yes'||state.stage!=='before',declined=state.rsvp==='no'&&state.stage==='before';return `<div class="ev-columns"><section class="ev-card"><h2>Deine Teilnahme</h2>${badge(done?'Du warst dabei':joined?'Du bist angemeldet':declined?'Du hast abgesagt':'Deine Antwort fehlt',joined?'yes':declined?'':'open')}<p class="ev-muted">${done?'Der Anlass ist abgeschlossen. Deine Abrechnung und Bewertung findest du in den anderen Ansichten.':joined?'Nina kann mit dir planen. Deinen Ess-Typ und deine Schätzung erfasst du in BillBro.':declined?'Die Organisation weiss Bescheid. Solange die Anmeldung offen ist, kannst du deine Antwort ändern.':'Sag Nina, ob du beim Monatsessen dabei bist.'}</p><div class="ev-actions">${done?button('Zur Abrechnung','billbro',true):joined?button('BillBro öffnen','billbro',true)+button('Teilnahme ändern','change'):button('Ich bin dabei','join',true)+(!declined?button('Ich kann nicht','decline'):'')}</div></section><section class="ev-aside"><h2>Zum Anlass</h2><div class="ev-row"><span>Organisation</span><strong>Nina</strong></div><div class="ev-row"><span>${done?'Teilgenommen':'Zusagen'}</span><strong>${state.stage==='before'?(state.rsvp==='yes'?13:12):12} Mitglieder</strong></div>${!done?`<div class="ev-row"><span>Antworten ausstehend</span><span>${state.stage==='before'&&state.rsvp==='open'?4:state.stage==='before'?3:0}</span></div>`:''}<p class="ev-muted">Treffpunkt direkt im Restaurant. Bei einer kurzfristigen Änderung melde dich bei Nina.</p><details><summary>Teilnehmende ansehen</summary><p>Nina · Luca · Alex · weitere Mitglieder</p></details>${state.role==='organizer'?`<div class="ev-full"><h2>Organisation</h2>${button('Event bearbeiten','edit-event')}<p class="ev-muted">Organisationsaktionen stehen bei den betreffenden Inhalten.</p></div>`:''}</section></div>`;}
function billbro(){if(state.stage==='after')return closed();if(state.stage==='before'&&state.rsvp!=='yes')return `<section class="ev-card"><div class="ev-locked">${icon('info')}<div><h2>Zuerst Teilnahme angeben</h2><p class="ev-muted">BillBro ist für die Teilnehmenden dieses Essens. Deine Schätzung und dein Ess-Typ gehören zu deiner Teilnahme.</p>${button('Zur Teilnahme','participation',true)}</div></div></section>`;
return `<div class="ev-columns"><section class="ev-card"><h2>Dein BillBro</h2>${badge(state.saved?'Deine Angaben sind gespeichert':'Eingabe offen',state.saved?'yes':'open')}<form id="ev-bill-form"><label class="ev-field" for="ev-food">Dein Ess-Typ<select id="ev-food"><option value="sparsam" ${state.food==='sparsam'?'selected':''}>Sparsam</option><option value="normal" ${state.food==='normal'?'selected':''}>Normal</option><option value="allin" ${state.food==='allin'?'selected':''}>All-in</option></select><small>Der Ess-Typ bestimmt deinen Anteil an der Rechnung.</small></label><label class="ev-field" for="ev-guess">Deine Schätzung · CHF<input id="ev-guess" inputmode="decimal" value="${state.guess}" aria-describedby="ev-guess-help ev-error"><small id="ev-guess-help">Gesamte Restaurantrechnung ohne Trinkgeld.</small></label><p id="ev-error" class="ev-error" role="alert" hidden></p><div class="ev-actions"><button type="submit" class="gf-primary">Angaben speichern</button></div></form></section><section class="ev-aside"><h2>So geht es weiter</h2><div class="ev-row"><span>1. Ess-Typ und Schätzung</span><span>Offen</span></div><div class="ev-row"><span>2. Rechnung erfassen</span><span>Nina</span></div><div class="ev-row"><span>3. Anteil bezahlen</span><span>Danach</span></div><p class="ev-muted">Dein endgültiger Betrag erscheint, sobald Nina die Abrechnung abgeschlossen hat.</p><details><summary>Wie wird mein Anteil berechnet?</summary><p>Sparsam: Gewicht 0.7 · Normal: 1.0 · All-in: 1.3. Die Rechnung einschliesslich Trinkgeld wird nach den Gewichten verteilt und nach der Eventregel gerundet.</p></details></section></div>${state.role==='organizer'?organizer():''}`;}
function organizer(){return `<section class="ev-card ev-full"><h2>Abrechnung vorbereiten</h2><p class="ev-note">Organisation · Beispielsituation mit 12 normalen Ess-Typen</p>${state.review?`<div class="ev-row"><span>Rechnung</span><span>CHF 960.00</span></div><div class="ev-row"><span>Trinkgeld</span><span>CHF 48.00</span></div><div class="ev-row"><strong>Gesamt</strong><strong>CHF 1’008.00</strong></div><div class="ev-row"><span>Pro Person</span><span>CHF 84.00</span></div><p class="ev-muted">${state.pay==='club'?'Es entstehen 12 Vereinsforderungen über je CHF 84.00.':'Nina legt privat aus. Die übrigen Teilnehmenden zahlen direkt an Nina; es entstehen keine Vereinsforderungen.'}</p><div class="ev-notice">Nach Abschluss sind Änderungen nur über einen Korrekturweg vorgesehen. Die genaue Fachregel ist noch offen.</div><div class="ev-actions">${button('Abrechnung abschliessen','finalize',true)}${button('Zurück','cancel-review')}</div>`:`<div class="ev-row"><span>Rechnung · erfasst</span><span>CHF 960.00</span></div><div class="ev-row"><span>Trinkgeld · Beispielwert</span><span>CHF 48.00</span></div><p class="ev-muted">Zahlweg: ${state.pay==='club'?'Vereinskonto':'Nina legt privat aus'}. Zuerst alle Anteile und finanziellen Folgen prüfen.</p><div class="ev-actions">${button('Abrechnung prüfen','review',true)}</div>`}</section>`;}
function closed(){return `<div class="ev-columns"><section class="ev-card"><div class="gf-eyebrow">Dein Essensanteil</div><div class="ev-money">CHF 84.00</div>${badge('Abrechnung abgeschlossen','yes')}<div class="ev-row"><span>Empfänger</span><strong>${state.pay==='club'?'Gourmen-Verein':'Nina'}</strong></div><div class="ev-row"><span>Bereits bezahlt</span><span>CHF 0.00</span></div><div class="ev-row"><strong>Noch offen</strong><strong>CHF 84.00</strong></div><p class="ev-muted">${state.pay==='club'?'Der Zahlungseingang wird über den Bankimport abgeglichen.':'Private Auslage: Nina bestätigt den Eingang direkt. Dieser Betrag läuft nicht über die Vereinsbuchhaltung.'}</p><div class="ev-actions">${button('Zahlungsdetails ansehen','payment',true)}</div><details><summary>Etwas stimmt nicht?</summary><p>Bitte mit Nina klären. Bereits bezahlte Beträge bleiben bei einer Korrektur nachvollziehbar.</p></details></section><section class="ev-aside"><h2>Die Abrechnung</h2><div class="ev-row"><span>Restaurantrechnung</span><span>CHF 960.00</span></div><div class="ev-row"><span>Trinkgeld</span><span>CHF 48.00</span></div><div class="ev-row"><strong>Gesamt</strong><strong>CHF 1’008.00</strong></div><p class="ev-muted">12 Teilnehmende · im Beispiel alle Ess-Typ Normal. Dein Anteil entspricht 1/12 des Gesamtbetrags.</p><details><summary>Schätzspiel ansehen</summary><p>Deine Schätzung: CHF ${state.guess}<br>Tatsächliche Rechnung: CHF 960.00<br>Abweichung: CHF ${Math.abs(960-Number(state.guess.replace(',', '.'))).toFixed(2)}</p><p class="ev-muted">Die Rangliste und Punkte folgen der noch zu bestätigenden GGL-Regel.</p></details>${state.role==='organizer'?`<div class="ev-full"><h2>Organisation</h2>${button('Korrektur vorbereiten','correction')}<p class="ev-note">Fachregel noch offen; keine direkte Neuberechnung.</p></div>`:''}</section></div>`;}
function ratings(){if(state.stage!=='after')return `<section class="ev-card"><div class="ev-locked">${icon('clock-3')}<div><h2>Bewertung nach dem Essen</h2><p class="ev-muted">Hier bewertest du Essen, Getränke und Service und hältst dein Highlight fest.</p><p class="ev-note">Nach dem Anlass für tatsächlich Anwesende geöffnet. Bewertungen bleiben ohne Frist abgebbar und bearbeitbar.</p></div></div></section>`;return `<div class="ev-columns"><section class="ev-card"><h2>Deine Bewertung</h2>${state.rated?badge('Bewertung gespeichert','yes'):''}<form id="ev-rating-form"><div class="ev-rating-grid">${[['food','Essen'],['drinks','Getränke'],['service','Service']].map(([id,label])=>`<label class="ev-field" for="ev-rate-${id}">${label}${id==='food'?'':' · optional'}<select id="ev-rate-${id}" ${id==='food'?'required':''}><option value="">Wählen</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${rating[id]===String(n)?'selected':''}>${n} / 5</option>`).join('')}</select></label>`).join('')}</div><label class="ev-field" for="ev-highlight">Dein Highlight <span class="ev-muted">Optional</span><textarea id="ev-highlight" placeholder="Was bleibt dir vom Abend in Erinnerung?"></textarea></label><div class="ev-actions"><button type="submit" class="gf-primary">Bewertung speichern</button></div></form></section><section class="ev-aside"><h2>Bewertungen des Abends</h2><div class="ev-row"><span>Gesamt · Durchschnitt</span><strong>4.3 / 5</strong></div><div class="ev-row"><span>Essen</span><span>4.5 / 5</span></div><div class="ev-row"><span>Getränke</span><span>4.0 / 5</span></div><div class="ev-row"><span>Service</span><span>4.5 / 5</span></div><p class="ev-note">Beispielwerte anderer Anwesender. Einzelbewertungen bleiben intern; Bearbeitung ohne Frist. Ausgefüllte Kategorien zählen gleich, fehlende Angaben nicht als null.</p><details><summary>Einzelne Bewertungen ansehen</summary><p>Nina · Essen 5 · Getränke 4 · Service 4<br>Luca · Essen 4 · Getränke 4 · Service 5</p></details></section></div>`;}
function draw(){app.dataset.view=state.view;root.style.colorScheme=state.theme==='auto'?'light dark':state.theme;toggle.setAttribute('aria-checked',String(state.theme==='dark'||state.theme==='auto'&&system.matches));root.querySelectorAll('button[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));root.querySelector('#ev-stage').value=state.stage;root.querySelector('#ev-phase-label').textContent={before:'Anmeldung offen',during:'BillBro offen',after:'Anlass abgeschlossen'}[state.stage];root.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===state.tab)));panel.innerHTML=state.tab==='participation'?participation():state.tab==='billbro'?billbro():ratings();root.querySelector('.gf-feedback').hidden=true;root.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));globalThis.lucide?.createIcons({attrs:{width:20,height:20}});}
root.addEventListener('change',e=>{if(e.target.id==='ev-stage'){state.stage=e.target.value;state.review=false;draw();save();}if(e.target.id==='ev-food')state.food=e.target.value;});
root.addEventListener('input',e=>{if(e.target.id==='ev-guess')state.guess=e.target.value.replace(/[^0-9.,]/g,'');});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='ev-bill-form'){const input=root.querySelector('#ev-guess'),n=Number(input.value.replace(',','.'));if(!Number.isFinite(n)||n<=0){const error=root.querySelector('#ev-error');error.hidden=false;error.textContent='Bitte einen Betrag grösser als CHF 0.00 eingeben.';input.setAttribute('aria-invalid','true');input.focus();return}state.guess=n.toFixed(2);state.saved=true;draw();feedback('Ess-Typ und Schätzung sind im Entwurf gespeichert.');}if(e.target.id==='ev-rating-form'){for(const id of ['food','drinks','service'])rating[id]=root.querySelector('#ev-rate-'+id).value;state.rated=true;const values=Object.values(rating).filter(Boolean).map(Number);feedback('Bewertung gespeichert · dein Gesamtwert '+(values.reduce((a,b)=>a+b,0)/values.length).toFixed(2)+' / 5. Ausgefüllte Kategorien gleich gewichtet; Bearbeitung bleibt möglich.');}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;close();draw();save();return}if(b===toggle){state.theme=toggle.getAttribute('aria-checked')==='true'?'light':'dark';root.style.colorScheme=state.theme;toggle.setAttribute('aria-checked',String(state.theme==='dark'));save();return}if(b===account){menu.hidden=!menu.hidden;account.setAttribute('aria-expanded',String(!menu.hidden));return}if(b.dataset.tab){state.tab=b.dataset.tab;draw();save();return}const a=b.dataset.action;if(a){if(['billbro','participation'].includes(a)){state.tab=a;draw();save();return}if(a==='join'||a==='decline'||a==='change'){state.rsvp=a==='join'?'yes':a==='decline'?'no':'open';if(a==='change'&&state.stage==='during')state.stage='before';draw();feedback('Teilnahmestatus im Entwurf geändert.');return}if(a==='review'||a==='cancel-review'){state.review=a==='review';draw();return}if(a==='finalize'){state.stage='after';state.review=false;draw();feedback('Beispielabrechnung abgeschlossen. Es wurden keine echten Forderungen erzeugt.');save();return}feedback({back:'Rückweg zur Eventliste mit bisherigem Filter und Position. Die Liste ist in diesem Entwurf nicht ausgearbeitet.',payment:state.pay==='club'?'Hier folgen Bankverbindung und eindeutige Zahlungsreferenz des Vereins. Im Entwurf werden keine echten Kontodaten verwendet.':'Hier folgen Ninas Zahlungsangaben. Nina bestätigt den Eingang; keine Vereinsbuchung.',correction:'Korrektur: Grund → bisherige und neue Anteile → bezahlte Beträge → Vorschau der Differenzen. Die berechtigte Rolle und die Behandlung von Rückzahlungen entscheiden wir separat.','edit-event':'Hier öffnet sich das Bearbeitungsformular für die Organisation.'}[a]||'Folgeansicht nicht ausgearbeitet.');return}if(b.dataset.go){feedback({events:'Events bleibt der aktive Hauptbereich. Zurück führt zur gefilterten Eventliste.',dashboard:'Hier öffnet sich dein Dashboard.',ggl:'Hier öffnet sich die GGL.',club:'Hier öffnet sich der Vereinsbereich.',public:'Das Logo führt zur öffentlichen Startseite.',profile:'Hier öffnet sich dein Profil.',security:'Hier öffnen sich deine Sicherheitseinstellungen.',settings:'Hier findest du Kalender, Benachrichtigungen und Installation.',logout:'Hier würdest du dich aus der App abmelden. Im Entwurf bleibst du angemeldet.'}[b.dataset.go]);close(menu.contains(b));}});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){e.preventDefault();close(true);}});document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target)&&!account.contains(e.target))close();});system.addEventListener('change',()=>{if(state.theme==='auto'){toggle.setAttribute('aria-checked',String(system.matches));}});window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState?.modelContent);draw();});
draw();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{draw();save();}});tweak.addSelect(state,'role',{label:'Ansicht',options:[{label:'Mitglied',value:'member'},{label:'Organisation',value:'organizer'}]});tweak.addSelect(state,'pay',{label:'Zahlweg nach Abschluss',options:[{label:'Vereinskonto',value:'club'},{label:'Nina legt privat aus',value:'private'}]});}
})();
</script>
