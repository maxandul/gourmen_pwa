<script>
(()=>{const root=document.getElementById('gourmen-public'),q=s=>root.querySelector(s),state={view:'desktop',theme:'auto',page:'home',hero:'split',error:false};let term='',sort='name';const restaurants=[{id:1,name:'Restaurant am Platz',place:'Zürich',type:'Saisonal',date:'2026-09-18',count:2,score:4.5,categories:[[4.5,2],[4,1],[5,1]]},{id:2,name:'Osteria Beispiel',place:'Winterthur',type:'Italienisch',date:'2026-08-21',count:1,score:3,categories:[[3,1],[null,0],[null,0]]},{id:3,name:'Bistro am See',place:'Zürich',type:'Mediterran',date:'2026-07-17',count:0,score:null,categories:[[null,0],[null,0],[null,0]]}],icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function results(){const list=restaurants.filter(r=>(r.name+' '+r.place).toLocaleLowerCase('de').includes(term.toLocaleLowerCase('de'))).sort((a,b)=>sort==='latest'?b.date.localeCompare(a.date):a.name.localeCompare(b.name,'de'));q('#gp-results').innerHTML=state.error?'<div class="gp-error" role="alert">Die Restaurantliste konnte nicht geladen werden. Deine Suche bleibt erhalten.<br><button id="gp-retry">Erneut versuchen</button></div>':`<p class="gp-results-title" role="status">${list.length} ${list.length===1?'Restaurant':'Restaurants'}${term?' für «'+esc(term)+'»':''}</p>${list.length?rows(list):'<p>Kein passendes Restaurant gefunden.</p><button id="gp-reset">Suche zurücksetzen</button>'}`;icons()}

<div class="gp-story"><div><p class="gp-kicker">DAS SIND WIR</p><h2>Am liebsten<br>zusammen<br>am Tisch.</h2></div><div><p>Wir sind Gourmen. Ein kulinarischer Verein aus Zürich – entstanden aus einem Kreis von Freunden und der Freude am gemeinsamen Essen.</p><p>Jeden Monat entdecken wir ein Restaurant. Wir probieren, diskutieren und halten unsere Eindrücke fest. Dazu kommen gemeinsame Ausflüge und unsere eigenen kleinen Traditionen.</p></div></div><div class="gp-principles"><article><span>01</span><h3>Entdecken</h3><p>Neue Küchen, neue Orte und gute Gründe, wiederzukommen.</p></article><article><span>02</span><h3>Zusammensitzen</h3><p>Ein regelmässiger Abend für gutes Essen und Gespräche.</p></article><article><span>03</span><h3>Erinnern</h3><p>Unsere Restaurantbesuche und Eindrücke an einem Ort.</p></article></div></section><section class="gp-section gp-food"><div class="gp-sectionhead"><div><p class="gp-kicker">UNTERWEGS MIT GOURMEN</p><h2>Wo wir<br>am Tisch sitzen.</h2></div><button data-restaurants>Zur Restaurantliste ${icon('arrow-up-right')}</button></div>${rows(restaurants)}<p class="gp-explain">Beispielrestaurants zur Beurteilung der Gestaltung. Namen und Besuche sind fiktiv.</p></section>`:`<section class="gp-section"><button class="gp-back" id="gp-back">${icon('arrow-left')}Zur Startseite</button><p class="gp-kicker">UNSERE KULINARISCHEN ENTDECKUNGEN</p><h1>Die Restaurantliste.</h1><p class="gp-lead">Orte, die wir gemeinsam besucht haben. Unsere Eindrücke aus Zürich und Umgebung.</p><form id="gp-search" class="gp-filters"><label>Restaurant oder Ort<input id="gp-query" type="search" placeholder="Zum Beispiel Zürich" value="${esc(term)}"></label><label>Sortierung<select id="gp-sort"><option value="name">Name A–Z</option><option value="latest">Zuletzt besucht</option></select></label><button type="submit" class="gp-cta">Suchen ${icon('search')}</button></form><div id="gp-results"></div><p class="gp-explain">Fiktive Beispieldaten · Skala 1–5. Jede Einzelbewertung zählt im Gesamtwert gleich. Nicht bewertete Kategorien zählen nicht als null.</p></section>`;if(state.page==='restaurants'){q('#gp-sort').value=sort;results()}chrome()}

modal(b.dataset.legal,'<p>Platzhalter für die freigegebenen Angaben des Vereins.</p><p class="gp-explain">Vor Veröffentlichung mit den tatsächlich eingesetzten Diensten und Kontaktdaten abgleichen.</p>');return}if(b.id==='gp-retry'){state.error=false;results();return}if(b.id==='gp-reset'){term='';q('#gp-query').value='';results();q('#gp-query').focus()}});
